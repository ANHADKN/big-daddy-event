<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Big Daddy Events</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #f4f7f6; padding: 2rem; color: #333; }
        h1 { color: #1a3c34; margin-bottom: 2rem; }
        table { width: 100%; border-collapse: collapse; background: #fff; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        th, td { padding: 1rem; text-align: left; border-bottom: 1px solid #eee; }
        th { background: #1a3c34; color: #fff; font-size: 0.85rem; letter-spacing: 0.05em; text-transform: uppercase; }
        .status-badge { padding: 0.25rem 0.5rem; border-radius: 4px; font-size: 0.75rem; font-weight: 600; }
        .status-CONFIRMED { background: #d4edda; color: #155724; }
        .status-PENDING { background: #fff3cd; color: #856404; }
        .status-FAILED { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <h1>Bookings Dashboard</h1>
    <table>
        <thead>
            <tr>
                <th>Booking ID</th>
                <th>Customer</th>
                <th>Package</th>
                <th>Event Date</th>
                <th>Total</th>
                <th>Paid</th>
                <th>Payment Status</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody id="bookings-tbody">
            <!-- Injected -->
        </tbody>
    </table>

    <script>
        const formatINR = (num) => new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR', maximumFractionDigits: 0 }).format(num);

        async function fetchBookings() {
            try {
                const res = await fetch('/api/admin/bookings');
                const bookings = await res.json();
                
                const tbody = document.getElementById('bookings-tbody');
                tbody.innerHTML = '';
                
                bookings.forEach(b => {
                    let statusClass = 'status-PENDING';
                    if(b.status === 'CONFIRMED') statusClass = 'status-CONFIRMED';
                    if(b.status === 'PAYMENT FAILED') statusClass = 'status-FAILED';

                    tbody.innerHTML += `
                        <tr>
                            <td><strong>${b.booking_id}</strong></td>
                            <td>${b.customer_name}<br><small>${b.phone}</small></td>
                            <td>${b.package_name}</td>
                            <td>${b.event_date}</td>
                            <td>${formatINR(b.package_amount)}</td>
                            <td>${formatINR(b.amount_paid)}</td>
                            <td><span class="status-badge ${statusClass}">${b.payment_status}</span></td>
                            <td><span class="status-badge ${statusClass}">${b.status}</span></td>
                        </tr>
                    `;
                });
            } catch (e) {
                console.error(e);
            }
        }
        fetchBookings();
    </script>
</body>
</html>
